name: '🧪 Test Plugin'

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'manifest.json'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'manifest.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build Plugin
        run: dotnet build -c Release JellySTRMprobe/JellySTRMprobe.csproj

      - name: Test Plugin
        run: dotnet test -c Release --no-build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-net${{ matrix.dotnet-version }}
          path: |
            JellySTRMprobe/bin/Release/net*/JellySTRMprobe.dll
            JellySTRMprobe/bin/Release/net*/JellySTRMprobe.pdb
          retention-days: 14
